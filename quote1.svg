<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <!-- Hiệu ứng phát sáng cho chữ và đường kẻ -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Gradient chuyển màu cho dòng chữ từ trắng sang tím hồng -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Gradient cho đường kẻ ngang phai dần về phía ngoài -->
    <linearGradient id="leftLineGrad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="1" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="rightLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="1" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Nền màu đen tối -->
  <rect width="1000" height="500" fill="#08080c" />

  <!-- Vùng chứa nội dung canh giữa -->
  <g transform="translate(500, 250)">
    
    <!-- Đường kẻ ngang bên trái -->
    <line x1="-460" y1="5" x2="-260" y2="5" stroke="url(#leftLineGrad)" stroke-width="2" filter="url(#glow)" />
    
    <!-- Đường kẻ ngang bên phải -->
    <line x1="260" y1="5" x2="460" y2="5" stroke="url(#rightLineGrad)" stroke-width="2" filter="url(#glow)" />

    <!-- Dòng chữ chính -->
    <text x="0" y="16" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="64" 
          font-weight="700" 
          text-anchor="middle" 
          fill="url(#textGradient)" 
          filter="url(#glow)"
          letter-spacing="-1">
      One day at a time.
    </text>
  </g>
</svg>
