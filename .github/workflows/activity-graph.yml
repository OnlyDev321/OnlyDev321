name: Update Profile Stats & Activity Graph

on:
  schedule:
    - cron: "0 */12 * * *" # Chạy tự động mỗi 12 tiếng
  workflow_dispatch: # Cho phép kích hoạt thủ công trên GitHub Actions tab
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate profile views badge
        run: |
          mkdir -p dist
          # 1. Tải views.svg hiện có từ branch output làm fallback dự phòng
          curl -s -f "https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ github.event.repository.name || 'OnlyDev321' }}/output/views.svg" -o dist/views.svg || true

          # 2. Tải badge mới từ komarev (timeout 60s, retry 3 lần)
          if curl -s --fail --connect-timeout 15 --max-time 60 --retry 3 "https://komarev.com/ghpvc/?username=${{ github.repository_owner }}&label=Profile%20views&color=00FFFF&style=flat-square" -o dist/tmp_views.svg; then
            if grep -q "<svg" dist/tmp_views.svg; then
              mv dist/tmp_views.svg dist/views.svg
            fi
            rm -f dist/tmp_views.svg
          fi

          # 3. Tạo fallback nếu chưa từng có file
          if [ ! -f dist/views.svg ]; then
            echo '<svg xmlns="http://www.w3.org/2000/svg" width="120.7" height="20"><mask id="a"><rect width="120.7" height="20" rx="0" fill="#fff"/></mask><g mask="url(#a)"><rect width="79.2" height="20" fill="#555"/><rect x="79.2" width="41.5" height="20" fill="#00FFFF"/></g><g fill="#fff" text-anchor="middle" font-family="DejaVu Sans,Verdana,Geneva,sans-serif" font-size="11"><text x="40.6" y="14">Profile views</text><text x="99" y="14" fill="#000">1,432</text></g></svg>' > dist/views.svg
          fi

      - name: Generate stats card
        run: |
          mkdir -p dist
          curl -s --fail --retry 3 "https://github-readme-stats-eight-theta.vercel.app/api?username=${{ github.repository_owner }}&cache_seconds=7200&layout=compact&theme=radical&border_radius=10" -o dist/stats.svg

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: "user=${{ github.repository_owner }}&theme=radical&border_radius=10"
          path: dist/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: "theme=radical&bg_color=141321&title_color=fe428e&line=fe428e&color=a9fef7&point=f8d847&border_color=E4E2E2&radius=10&custom_title=OnlyDev321 Activity Graph"
          output_path: dist/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
