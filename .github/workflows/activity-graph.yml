name: Update Activity Graph

on:
  schedule:
    - cron: "0 */12 * * *" # Chạy tự động mỗi 12 tiếng
  workflow_dispatch: # Cho phép kích hoạt thủ công trên GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: "theme=redical&bg_color=141321&title_color=fe428e&line=fe428e&color=a9fef7&point=f8d847&border_color=E4E2E2&radius=10&custom_title=OnlyDev321 Activity Graph"
          output_path: dist/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push activity-graph.svg to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
